<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- HUDHUD D-04: القالب معرب بهوية هدهد — العقد محفوظ: نفس مسار POST / ونفس معرفات الحقول -->
    <title>هدهد للتحقق | HUDHUD Verify</title>
    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 0;
            flex-direction: column;
            justify-content: space-between;
            align-items: baseline;
            height: 100vh;
            background: #fff;
        }

        header {
            width: 100%;
            height: 60px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: #e5e5e5 solid 2px;
        }

        header .brand {
            margin-right: 50px;
            margin-left: auto;
            font-size: 18px;
            font-weight: 700;
            color: #4871b7;
        }

        .fact-check {
            padding: 5% 0;
            width: 90%;
            align-items: center;
        }

        .fact-check label {
            margin-right: 10%;
            font-size: 20px;
        }

        .fact-check textarea {
            margin: 20px 0;
            width: 90%;
            height: 100%;
            margin-right: 10%;
            border-radius: 10px;
            font-size: 15px;
            border-color: #a9bee3;
            font-family: inherit;
        }

        .fact-check button {
            margin-right: 80%;
            width: 20%;
            padding: 10px 20px;
            background-color: #4871b7;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        .fact-check button:hover {
            background-color: #a9bee3;
        }

        footer {
            padding: 10px;
            width: 100%;
            color: #333;
            background-color: #fbfbfb;
            text-align: center;
            position: fixed;
            bottom: 0;
            border: #a9bee3 solid 2px;
        }

        #timer {
            margin-right: 80%;
            width: 18%;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#Button').click(function (event) {
                // Submit the form — نفس عقد الأصل
                $(this).closest('form').submit();
                $(this).prop('disabled', true);

                // مؤقت الزمن المنقضي — عربي
                var timeElapsed = 0;
                $('#timer').text('الزمن المنقضي: ' + timeElapsed + ' ثانية');
                var timerId = setInterval(function () {
                    timeElapsed++;
                    $('#timer').text('الزمن المنقضي: ' + timeElapsed + ' ثانية');
                }, 1000);
            });
        });
    </script>
</head>

<body>
    <header>
        <!-- HUDHUD D-04: هوية هدهد تحل محل علامة LibrAI الأجنبية -->
        <div class="brand">هدهد للتحقق · HUDHUD Verify</div>
    </header>

    <main class="fact-check">
        <form method="post" action="/">
            <label for="response">أدخل النص أو الادعاء للتحقق منه:</label><br>
            <textarea id="response" name="response" rows="4" cols="50"
                placeholder="أدخل ما تريد التحقق منه..."></textarea><br>
            <button id="Button" type="submit">تحقق الآن</button>
        </form>
        <p id="timer"></p>
    </main>

    <footer>
        <p>منظومة هدهد للتحقق — HUDHUD Verify</p>
    </footer>
</body>

</html>
